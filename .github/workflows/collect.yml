name: collect

# Every 3 hours. Chosen for storage and for signal quality, not for detail:
# one snapshot costs ~236 KB, so 15-min collection fills the Neon free tier in
# 23 days while 3-hour collection lasts 275. 24h/3d/7d comparisons need only
# 8/24/56 points, which 3-hour sampling gives comfortably. Only the 6h window
# gets thin (2 points), and that metric is the least useful of the four.
on:
  # No `schedule` on purpose. It used to sit next to repository_dispatch, so at
  # every third hour BOTH fired and the whole market was collected twice -
  # `cancel-in-progress: false` queues the duplicate rather than dropping it.
  # Measured: 429 duplicate pairs with <=3 minutes between them over 41 h.
  #
  # The external pinger alone is enough and, unlike GitHub's best-effort
  # scheduler, it fires on time. collect.py also refuses to run when the
  # newest snapshot is younger than 30 min, so this holds even if a schedule
  # is added back.
  #
  # Pinger sends POST /repos/CrimNeh/trendradar/dispatches with
  # {"event_type": "tick"} using a token that only has Actions: write.
  repository_dispatch:
    types: [tick]
  workflow_dispatch:

# Pages is deployed by uploading an artifact, not by committing to the repo.
# Committing was the source of every "failed to push" conflict: the bot and the
# human both wrote docs/ in the same branch.
permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

env:
  # Read once here instead of repeating it on every step. The database is
  # Postgres (Neon free tier) so nothing is persisted through the Actions
  # cache - the cache is evicted without warning and would silently reset the
  # whole history.
  TRENDRADAR_DB: ${{ secrets.TRENDRADAR_DB }}
  # Optional. Without it the RSS collector still runs; the API is only
  # used for keyword discovery and exact stats.
  YT_API_KEY: ${{ secrets.YT_API_KEY }}
  PYTHONUNBUFFERED: "1"

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # 15, not 35. With YouTube moved to its own job this one only collects
    # Roblox snapshots (~2 min) and derives the reports and the digest from
    # them (~3-5 min). The old 35 existed to absorb the 120 MB embedding model
    # and a slow RSS sweep, neither of which is here any more.
    #
    # The real point is that this job is now on the critical path ALONE: if it
    # dies, nothing publishes. So its ceiling is set just above measured cost
    # instead of generously above a worst case that no longer lives here.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      # Fail here, with a readable message, rather than deep inside a collector
      # with a traceback nobody can act on.
      - name: Check database secret
        run: |
          if [ -z "$TRENDRADAR_DB" ]; then
            echo "::error::Secret TRENDRADAR_DB is not set."
            echo "Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "Name: TRENDRADAR_DB   Value: postgresql://... (from neon.tech)"
            exit 1
          fi
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          url = os.environ["TRENDRADAR_DB"]
          e = create_engine(url.replace("postgresql://", "postgresql+psycopg2://", 1))
          with e.connect() as c:
              c.execute(text("select 1"))
          print("database reachable")
          PY

      # The semantic index (data/emb_cache.npz: one vector per game + the
      # hubness pool) is NOT in git - it is derived data, and `data/` is
      # gitignored for exactly that reason. But it was also missing from
      # Actions cache, so every run rebuilt it from zero: `sync_games()` saw
      # an empty `uids` set and re-embedded all ~1200 games plus a fresh
      # 1500-window hubness pool before matching a single video title. That
      # is pure waste on every run except the very first.
      #
      # actions/cache cannot overwrite an existing key, so the key must be
      # unique per run (github.run_id) with restore-keys falling back to the
      # most recent prior save - the usual "always save, restore nearest"
      # pattern for caches whose content changes every run. A stale restore
      # is harmless: `sync_games()` only ADDS games it has not seen, so an
      # old cache just means slightly more re-embedding this run, never wrong
      # matches.
      - name: Cache semantic index
        uses: actions/cache@v5
        with:
          path: data/emb_cache.npz
          key: emb-index-${{ github.run_id }}
          restore-keys: |
            emb-index-

      - name: Create schema
        run: python src/db.py

      - name: Collect Roblox
        run: python src/collect.py

      - name: Report
        run: python src/report.py

      # The decision layer: which niches are open, what to build, what to avoid.
      # Runs after report.py so both land in the same artifact.
      - name: Opportunities (what to build)
        run: python src/opportunity.py

      # The clone-target ranking. opportunity.py answers "where is the market
      # empty"; this answers "who is winning and can be copied", which is the
      # actual strategy being run here.
      - name: Clone targets (who to copy)
        run: python src/clone_targets.py

      # Presentation dashboard: who is gaining share, who is losing it, with
      # YouTube evidence. Writes docs/index.html.
      - name: Build HTML digest
        run: python src/digest_html.py

      # Log what this run recommends. Written BEFORE anything is judged, and
      # deduped per game, so eight runs a day cannot inflate the sample by
      # predicting the same game eight times.
      - name: Record forecasts
        run: python src/predictions.py record

      # Judge anything whose horizon has passed. Writes outcome once; a settled
      # forecast is never revisited.
      - name: Resolve due forecasts
        run: python src/predictions.py resolve

      # Keep the markdown/CSV reports for 7 days. The database itself lives in
      # Neon, so there is nothing to upload for it.
      - name: Keep reports (7 days)
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: reports-${{ github.run_id }}
          path: reports/
          retention-days: 7

  # YouTube collection lives in its OWN job, not inside `snapshot`.
  #
  # Why: run #105 (2026-10-31) died at the job-level 35-minute ceiling with
  # `Collect YouTube` and `YouTube discovery` both timing out. Because a job
  # timeout cancels the job, every step after them was skipped - report,
  # opportunities, clone targets, the digest, the forecast record AND the
  # resolve. `continue-on-error: true` on those steps was already set and could
  # not help: it protects against a STEP failing, not against the clock running
  # out on the JOB.
  #
  # The two halves have nothing to do with each other. Roblox snapshots take
  # ~2 minutes and produce everything the site shows; YouTube enrichment is
  # slow, resumable and entirely optional. Putting the optional half on the
  # critical path meant a slow RSS poll could cost a day of forecasts, which
  # is exactly what happened twice.
  #
  # Now the worst case for YouTube is that this job fails alone. Steps are
  # already due-gated and resumable, so the next tick picks the work back up.
  youtube:
    runs-on: ubuntu-latest
    # Own ceiling, sized for the semantic pass on a cold model cache. Nothing
    # downstream depends on this job, so a generous bound costs nothing.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Cache embedding model
        uses: actions/cache@v5
        with:
          path: data/models
          key: emb-model-v1

      - name: Cache semantic index
        uses: actions/cache@v5
        with:
          path: data/emb_cache.npz
          key: emb-index-${{ github.run_id }}
          restore-keys: |
            emb-index-

      - name: Create schema
        run: python src/db.py

      # Link + token matching run every tick; the semantic pass loads a 120 MB
      # model and embeds every unmatched title, so it runs on a minority of
      # ticks. With 8 runs/day, hours divisible by 3 give exactly 2 full passes
      # (00:00 and 12:00 UTC) and 6 cheap ones.
      - name: Collect YouTube
        continue-on-error: true
        timeout-minutes: 14
        run: |
          if python src/due.py youtube_full 11; then
            python src/youtube_collect.py && python src/due.py mark youtube_full
          else
            python src/youtube_collect.py --no-embed
          fi

      # API discovery: searches YouTube BY GAME NAME for the games that moved
      # most, instead of waiting for a tracked channel to mention one. Costs
      # real quota (1,100 units/run), so twice a day with a hard budget.
      # Without YT_API_KEY it exits immediately and RSS carries on.
      - name: YouTube discovery (API)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          if python src/due.py yt_discovery 11; then
            python src/yt_discovery.py --budget 1200 && python src/due.py mark yt_discovery
          fi

      # Weekly channel audit: deactivates feeds that produce no Roblox signal.
      # Run on Monday 00:00 so it does not race the discovery pass.
      - name: Audit channels (weekly)
        continue-on-error: true
        run: |
          if python src/due.py audit 160; then
            python src/channel_quality.py --apply && python src/due.py mark audit
          fi

      # External sources change slowly (Steam charts, anime calendar, devforum).
      # Steam alone is ~40 throttled requests, so twice a day is both sufficient
      # and safe from rate limits.
      - name: Collect origins (every ~11h)
        continue-on-error: true
        run: |
          if python src/due.py origins 11; then
            python src/origins.py && python src/due.py mark origins
          fi

  # Separate job because Pages deployment needs its own permissions and an
  # environment.
  deploy:
    needs: snapshot
    # Publish even when the snapshot job failed. The digest is rebuilt from the
    # database inside this job, so a failed Roblox collection means the page
    # shows the last good data - which is strictly better than the site not
    # updating at all. Before this, one flaky collect.py call blanked the site
    # until someone noticed.
    if: always() && needs.snapshot.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt

      # The markdown report is produced by opportunity.py in the snapshot job and
      # captured as an artifact. Without this download the copy step below found
      # an empty reports/ directory, its `|| true` swallowed the failure, and
      # docs/opportunity.md was never published - silently, on every run.
      # `continue-on-error` because this artifact does not exist when the
      # snapshot job failed - and that is exactly the case deploy now runs in
      # on purpose (see `if:` above). Without it the missing artifact aborted
      # the job before the digest was built, so allowing a failed snapshot to
      # reach deploy would have published nothing anyway.
      - name: Fetch reports from the snapshot job
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: reports-${{ github.run_id }}
          path: reports/

      # Rebuild the page from the live database. The snapshot job's copy is not
      # shared between jobs, and the page must reflect the same data the
      # forecasts were recorded against.
      - name: Build HTML digest
        run: python src/digest_html.py
        env:
          TRENDRADAR_DB: ${{ secrets.TRENDRADAR_DB }}

      - name: Add markdown copy
        run: |
          latest=$(ls -t reports/*_opportunity.md 2>/dev/null | head -1 || true)
          if [ -n "$latest" ]; then
            cp "$latest" docs/opportunity.md
          else
            echo "::warning::no opportunity.md in the reports artifact"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
